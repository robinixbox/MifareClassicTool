jdk:
  - openjdk17
before_install:
  - sdk install java 17.0.1-open
  - sdk use java 17.0.1-open
install:
  - echo "Running in $(pwd)"
  - cd "Mifare Classic Tool"
  - ./gradlew assembleRelease
  - mkdir -p artifacts
  - cp app/build/outputs/apk/release/app-release.apk $ARTIFACT_DIR/MifareClassicToolPlus.apk