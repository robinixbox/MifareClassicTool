name: Build APK

on:
  push:
    branches: [ material-ui-upgrade ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x "./Mifare Classic Tool/gradlew"
        
      - name: Build with Gradle
        working-directory: "./Mifare Classic Tool"
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MifareClassicToolPlus
          path: "./Mifare Classic Tool/app/build/outputs/apk/debug/app-debug.apk"